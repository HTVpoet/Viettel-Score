spring.application.name=Viettel-Score-Core

# Server port
server.port=8089

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scoredb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cache configuration
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/viettel-score

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=product-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer