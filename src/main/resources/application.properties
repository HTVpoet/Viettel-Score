spring.application.name=Viettel-Score-Core

# Server port
server.port=8089

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scoredb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cache configuration
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/viettel-score

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200