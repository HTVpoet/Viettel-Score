spring.application.name=Viettel-Score-Core
server.servlet.context-path=/viettel-score-core

# Server port
server.port=8089

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scoredb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cache configuration
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/viettel-score

# MinIO configuration
minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123456
minio.bucket-name=avatars

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB